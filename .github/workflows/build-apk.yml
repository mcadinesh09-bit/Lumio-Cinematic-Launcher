
name: Build Lumio Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lumio Launcher V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          "$SDKMANAGER" --version

      - name: Install Android SDK 35
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Lumio Launcher V2
        run: |
          unzip -o LumioCinematicLauncher_V2_CloudBuild.zip -d project
          ls -la project/LumioCinematicLauncher

      - name: Build Debug APK
        run: |
          gradle -p project/LumioCinematicLauncher assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="project/LumioCinematicLauncher/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          test -f "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Cinematic-Launcher-V2
          path: project/LumioCinematicLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
