
name: Build Lumio Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lumio Launcher V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract Lumio Launcher V2
        run: |
          unzip -o LumioCinematicLauncher_V2_CloudBuild.zip -d project
          ls -la project/LumioCinematicLauncher

      - name: Build Debug APK
        run: |
          gradle -p project/LumioCinematicLauncher \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        run: |
          ls -lh project/LumioCinematicLauncher/app/build/outputs/apk/debug/
          test -f project/LumioCinematicLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Cinematic-Launcher-V2
          path: project/LumioCinematicLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
