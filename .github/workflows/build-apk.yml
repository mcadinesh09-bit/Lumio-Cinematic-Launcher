
name: Build Lumio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and configure Android SDK
        run: |
          echo "Searching for Android SDK..."
          ls -la "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: unzip -o LumioCinematicLauncher_CloudBuild.zip -d .

      - name: Build APK
        run: gradle -p LumioCinematicLauncher assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Cinematic-Launcher-APK
          path: LumioCinematicLauncher/app/build/outputs/apk/debug/*.apk
